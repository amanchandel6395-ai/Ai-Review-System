<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Zuit — Share Your Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--bg2:#141414;--bg3:#1C1C1C;--card:#181818;--card2:#202020;
  --y:#F5C518;--y2:#FFD740;--y3:rgba(245,197,24,0.13);--y4:rgba(245,197,24,0.06);
  --w:#FFFFFF;--ow:#F0F0F0;--g:#777;--g2:#444;
  --bd:rgba(255,255,255,0.07);--bdy:rgba(245,197,24,0.22);
  --r:18px;--rsm:12px;--rxs:8px;
  --f:'Inter',sans-serif;--fs:'Playfair Display',serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--w);font-family:var(--f);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  animation:sOut 0.5s 2.2s ease forwards}
@keyframes sOut{to{opacity:0;pointer-events:none;visibility:hidden}}
.sl{font-family:var(--fs);font-size:52px;font-style:italic;
  background:linear-gradient(135deg,var(--y),var(--y2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:pop .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.st{font-size:11px;color:var(--g);letter-spacing:.18em;text-transform:uppercase;
  animation:fu .5s .5s ease both}
.sring{width:36px;height:36px;border-radius:50%;border:2px solid var(--bg3);
  border-top-color:var(--y);animation:spin 1s .3s linear infinite;position:absolute;bottom:64px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* APP */
#app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;
  opacity:0;animation:fu .7s 2.4s ease forwards}
#pgbar{position:fixed;top:0;left:0;height:2px;
  background:linear-gradient(90deg,var(--y),var(--y2));
  box-shadow:0 0 8px rgba(245,197,24,.5);z-index:900;transition:width .4s ease}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);
  background-size:200% 100%;animation:sk 1.6s infinite;border-radius:var(--rsm)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* HERO */
.hero{position:relative;height:270px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;transform:scale(1.07);transition:transform 7s ease}
.hero img.ok{transform:scale(1)}
.hov{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,10,10,.08)0%,rgba(10,10,10,.45)45%,rgba(10,10,10,.96)86%,var(--bg)100%)}
.hbody{position:absolute;bottom:0;left:0;right:0;padding:0 18px 22px}
.htag{display:inline-flex;align-items:center;gap:6px;
  background:rgba(245,197,24,.14);border:1px solid rgba(245,197,24,.3);
  color:var(--y);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 12px;border-radius:100px;margin-bottom:9px;backdrop-filter:blur(8px);
  animation:fu .5s .3s ease both}
.htag::before{content:'';width:5px;height:5px;background:var(--y);border-radius:50%;
  box-shadow:0 0 6px var(--y);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hname{font-family:var(--fs);font-size:clamp(22px,6vw,30px);color:var(--w);
  line-height:1.1;animation:fu .5s .45s ease both}
.hdesc{font-size:12.5px;color:rgba(255,255,255,.48);margin-top:5px;line-height:1.5;
  animation:fu .5s .6s ease both}

/* CARDS */
.cards{padding:12px 14px 44px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;
  opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease,border-color .3s}
.card.in{opacity:1;transform:translateY(0)}
.card:hover{border-color:rgba(245,197,24,.1)}
.clbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--y);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.clbl::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(245,197,24,.2),transparent)}

/* STARS */
.stars-row{display:flex;justify-content:center;gap:4px;padding:4px 0}
.sbtn{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;outline:none;
  -webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.sbtn:active{transform:scale(.8)!important}
.ssvg{width:46px;height:46px;display:block;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.sbtn.lit .ssvg{transform:scale(1.18)}
.sbtn.lit .ssvg path{fill:var(--y);filter:drop-shadow(0 0 8px rgba(245,197,24,.65))}
.sbtn:not(.lit) .ssvg path{fill:rgba(255,255,255,.09)}
.mood-lbl{text-align:center;margin-top:12px;min-height:22px;
  font-size:15px;font-weight:600;color:var(--y);transition:all .3s ease}

/* Q&A */
.qblock{margin-bottom:18px}.qblock:last-child{margin-bottom:0}
.qtop{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.qnum{width:21px;height:21px;border-radius:50%;background:var(--y3);
  border:1px solid var(--bdy);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--y);flex-shrink:0}
.qtxt{font-size:13px;font-weight:500;color:var(--ow)}
.chips-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg3);border:1px solid var(--bd);color:var(--g);
  font-family:var(--f);font-size:12.5px;font-weight:400;
  padding:7px 13px;border-radius:100px;cursor:pointer;
  transition:all .17s ease;outline:none;-webkit-tap-highlight-color:transparent}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--y3);border-color:rgba(245,197,24,.4);color:var(--y);font-weight:600}

/* GENERATE BTN */
.btn-gen{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:15px 20px;border-radius:var(--rsm);border:none;margin-top:18px;
  background:linear-gradient(135deg,var(--y),var(--y2));color:#0A0A0A;
  font-family:var(--f);font-size:14.5px;font-weight:700;
  cursor:pointer;transition:all .3s;outline:none;-webkit-tap-highlight-color:transparent}
.btn-gen:hover{box-shadow:0 8px 26px rgba(245,197,24,.38);transform:translateY(-1px)}
.btn-gen:active{transform:scale(.97)}
.btn-gen:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none}

/* LOADING */
.dw{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--y);animation:db 1.2s infinite}
.dot:nth-child(2){animation-delay:.15s;opacity:.7}
.dot:nth-child(3){animation-delay:.3s;opacity:.4}
@keyframes db{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.dlbl{font-size:13px;color:var(--g);font-weight:500}

/* REVIEW BOX */
.aihdr{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.aibadge{display:flex;align-items:center;gap:5px;
  background:var(--y3);border:1px solid var(--bdy);
  color:var(--y);font-size:10px;font-weight:700;letter-spacing:.08em;
  padding:3px 10px;border-radius:100px;text-transform:uppercase}
.ainote{font-size:11px;color:var(--g)}
.rta{width:100%;background:var(--bg3);border:1px solid rgba(245,197,24,.18);
  border-radius:var(--rsm);color:var(--w);font-family:var(--f);
  font-size:13.5px;line-height:1.7;padding:14px;resize:none;min-height:105px;
  outline:none;transition:border-color .3s}
.rta:focus{border-color:rgba(245,197,24,.42)}
.rta::placeholder{color:var(--g2)}
.rfooter{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.wct-txt{font-size:11px;color:var(--g)}
.wbar-track{height:2px;background:var(--bg3);border-radius:1px;overflow:hidden;margin-top:5px}
.wbar-fill{height:100%;border-radius:1px;background:linear-gradient(90deg,var(--y),var(--y2));transition:width .3s}
.regen{display:flex;align-items:center;gap:5px;background:none;
  border:1px solid var(--bd);color:var(--g);font-family:var(--f);
  font-size:11.5px;padding:5px 11px;border-radius:100px;cursor:pointer;transition:all .2s;outline:none}
.regen:hover{border-color:var(--bdy);color:var(--y)}

/* MODE TABS */
.mtabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--bd);
  border-radius:var(--rxs);padding:4px;margin-bottom:14px}
.mtab{flex:1;padding:8px;border-radius:6px;border:none;background:none;
  font-family:var(--f);font-size:12.5px;font-weight:500;color:var(--g);cursor:pointer;transition:all .2s;outline:none}
.mtab.active{background:var(--y3);color:var(--y);border:1px solid var(--bdy)}
.dta{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rsm);
  color:var(--w);font-family:var(--f);font-size:13.5px;line-height:1.7;
  padding:14px;resize:none;min-height:100px;outline:none;transition:border-color .3s}
.dta:focus{border-color:rgba(245,197,24,.35)}
.dta::placeholder{color:var(--g2)}

/* PLATFORM */
.plbl{font-size:11.5px;color:var(--g);margin-bottom:9px;font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 5px;border-radius:var(--rxs);border:1.5px solid var(--bd);
  background:var(--bg3);cursor:pointer;transition:all .17s;outline:none;
  -webkit-tap-highlight-color:transparent}
.pbtn:hover{border-color:rgba(245,197,24,.3);background:var(--y4)}
.pbtn.sel{border-color:var(--y);background:var(--y3)}
.pbtn .pi{font-size:20px;line-height:1}
.pbtn .pn{font-size:10px;font-weight:600;color:var(--g)}
.pbtn.sel .pn{color:var(--y)}

/* ACTION BTNS */
.btn-post{display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:15px 20px;border-radius:var(--rsm);border:none;
  font-family:var(--f);font-size:14.5px;font-weight:700;cursor:pointer;transition:all .3s;outline:none;
  background:linear-gradient(135deg,#4285F4,#34A853);color:#fff}
.btn-post:hover{box-shadow:0 8px 26px rgba(66,133,244,.4);transform:translateY(-1px)}
.btn-cp{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px 20px;border-radius:var(--rsm);
  background:transparent;border:1px solid var(--bd);
  color:rgba(255,255,255,.65);font-family:var(--f);font-size:14px;font-weight:500;
  cursor:pointer;transition:all .2s;outline:none}
.btn-cp:hover{border-color:var(--bdy);color:var(--y)}

/* PASTE HELPER */
#ph{position:fixed;inset:0;z-index:800;background:rgba(10,10,10,.97);
  backdrop-filter:blur(16px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;animation:fu .4s ease}
.phi{font-size:50px}
.pht{font-family:var(--fs);font-size:24px;color:var(--w);text-align:center}
.pht span{color:var(--y)}
.phrv{background:var(--bg2);border:1px solid rgba(245,197,24,.2);
  border-radius:var(--rsm);padding:15px 18px;max-width:380px;width:100%}
.phrl{font-size:10px;color:var(--y);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.phrt{font-size:12.5px;color:var(--ow);line-height:1.65;max-height:85px;overflow-y:auto}
.phin{background:var(--card);border:1px solid var(--bd);border-radius:var(--rsm);
  padding:16px 18px;max-width:380px;width:100%;text-align:center}
.phit{font-size:14px;font-weight:600;color:var(--w);margin-bottom:8px}
.phis{font-size:12px;color:var(--g);line-height:1.65}
.phk{display:inline-block;background:var(--y3);border:1px solid var(--bdy);
  color:var(--y);font-weight:700;padding:2px 9px;border-radius:5px;font-size:13px}
.ph-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ph-y{background:linear-gradient(135deg,var(--y),var(--y2));color:#0A0A0A;
  font-family:var(--f);font-size:13px;font-weight:700;padding:12px 20px;
  border-radius:var(--rxs);border:none;cursor:pointer}
.ph-cl{background:transparent;border:1px solid var(--bd);color:var(--g);
  font-family:var(--f);font-size:13px;padding:12px 20px;border-radius:var(--rxs);cursor:pointer}

/* TOAST */
#toast{position:fixed;bottom:26px;left:50%;
  transform:translateX(-50%) translateY(70px);opacity:0;
  background:var(--card2);border:1px solid var(--bd);color:var(--w);
  font-size:13px;font-weight:500;padding:12px 20px;border-radius:100px;
  display:flex;align-items:center;gap:8px;z-index:700;white-space:nowrap;
  backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,.5);
  transition:all .42s cubic-bezier(.34,1.56,.64,1)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.y{border-color:rgba(245,197,24,.3)}
#toast.g{border-color:rgba(16,185,129,.3)}
.pwrd{text-align:center;font-size:11px;color:rgba(255,255,255,.18);padding:4px 0 26px;letter-spacing:.05em}
.pwrd span{color:var(--y);opacity:.7}
.err{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:12px;padding:40px}
.erri{font-size:44px}.errt{font-family:var(--fs);font-size:22px;color:var(--w)}.errs{font-size:13px;color:var(--g)}
</style>
</head>
<body>
<div id="pgbar" style="width:0%"></div>
<div id="splash"><div class="sl">Zuit</div><div class="st">Smart Review Platform</div><div class="sring"></div></div>
<div id="toast"><span id="ti"></span><span id="tm"></span></div>
<div id="app">
  <div id="skel" style="padding:0 0 20px">
    <div class="sk" style="height:270px;border-radius:0;margin-bottom:12px"></div>
    <div style="padding:0 14px;display:flex;flex-direction:column;gap:10px">
      <div class="sk" style="height:58px"></div><div class="sk" style="height:155px"></div>
    </div>
  </div>
  <div id="ct" style="display:none"></div>
</div>
<script>
const API = window.API_BASE ||
  (location.hostname === 'localhost'
    ? 'http://localhost:3001/api'
    : 'https://ai-review-system-1.onrender.com/api');
let MAX_W=65;
const ICONS={restaurant:'🍽️',hotel:'🏨',salon:'💇',bar:'🍸',hospital:'🏥',cafe:'☕',gym:'💪',spa:'🧖',retail:'🛍️',clothing:'👗',other:'⭐'};
const MOODS={1:'Ugh, that bad? 😬',2:'Not great at all 😕',3:'It was just okay 😐',4:'Pretty good! 😊',5:'Absolutely loved it! 🤩'};

const QS={
  restaurant:[
    {id:'q1',q:'What did you eat?',chips:['Biryani','Pizza','Burger','Pasta','Thali','Kebabs','Starters','Dessert','Dal makhani']},

  ],

    {id:'q3',q:'What impressed you most?',chips:['Room cleanliness','Friendly staff','Great location','Breakfast spread','Fast WiFi','Value for money']}
  ],
  salon:[
    {id:'q1',q:'What service did you get?',chips:['Haircut','Hair colour','Blowdry','Facial','Manicure or Pedicure','Waxing','Hair treatment']},

  ],

    {id:'q2',q:'How were the drinks?',chips:['Excellent quality','Well crafted','Good selection','Decent enough','Not worth the price']},
    {id:'q3',q:'How was the vibe?',chips:['Great energy','Live music was a plus','Very chill','Nice crowd','Fun night out']}
  ],
  hospital:[

    {id:'q2',q:'How long did you wait?',chips:['No wait at all','Under 15 minutes','Around 30 minutes','Waited too long']},
    {id:'q3',q:'How was the overall experience?',chips:['Very clean','Well organised','Friendly staff','Good equipment','Could be better']}
  ],
  gym:[

    {id:'q2',q:'How was the equipment?',chips:['Modern and well-kept','Good variety','Mostly functional','Some things outdated']},

  ],

    {id:'q2',q:'How did you feel after?',chips:['Completely relaxed','Totally rejuvenated','Much lighter','Pretty good','Could have been better']},

    {id:'q3',q:'Would you come back?',chips:['Absolutely yes','Very likely','Maybe someday','Probably not','Definitely not']}

};
QS.retail=QS.clothing;

function humanReview(rating,type,name,ans){
  const a1=ans[0]||'',a2=ans[1]||'',a3=ans[2]||'';
  const op5=[`Genuinely one of the better ${type} experiences I've had in a while.`,`${name} really knows what they're doing.`,`Came with high expectations and ${name} still managed to exceed them.`,`Really glad I chose ${name} — did not disappoint at all.`,`${name} nailed it from start to finish.`];
  const op4=[`Pretty solid visit to ${name}.`,`Had a good time at ${name} overall.`,`${name} was a good choice — no regrets.`,`Came to ${name} and left quite satisfied.`];
  const op3=[`${name} was alright — had its moments.`,`Mixed bag at ${name} honestly.`,`Decent visit to ${name}, though a few things could be better.`];
  const op2=[`Bit underwhelmed by ${name} this time.`,`Expected more from ${name} if I'm honest.`,`${name} didn't quite hit the mark.`];
  const op1=[`Really not a good experience at ${name}.`,`${name} needs some serious attention.`,`Won't be returning to ${name} anytime soon.`];
  const ops={5:op5,4:op4,3:op3,2:op2,1:op1};
  const ends5=['Would go back without a second thought.','Telling everyone I know about this place.','Highly recommended — no hesitation.','Will definitely be making this a regular.'];
  const ends4=['Would come back for sure.','Happy to recommend this.','Good place, worth a visit.','Will be back.'];
  const ends3=['Might give it another shot.','Room to improve but not bad overall.','Okay for the price.'];
  const ends2=['Hopefully better next time.','Would need to see improvements before I return.','Not in a rush to go back.'];
  const ends1=['Would not recommend at this point.','Hope they sort things out soon.','Disappointed overall.'];
  const endss={5:ends5,4:ends4,3:ends3,2:ends2,1:ends1};
  const pool=ops[rating]||op3;const epool=endss[rating]||ends3;
  const opener=pool[Math.floor(Math.random()*pool.length)];
  const ender=epool[Math.floor(Math.random()*epool.length)];
  let mid='';
  if(a1&&a2){
    if(rating>=4)mid=`${a1} was ${a2.toLowerCase()}, and ${a3?a3.toLowerCase()+' really made the difference':'the whole experience was solid'}.`;
    else if(rating===3)mid=`${a1} was ${a2.toLowerCase()} — ${a3?a3.toLowerCase()+' could use some work':'nothing too remarkable'}.`;
    else mid=`${a1} was ${a2.toLowerCase()} and ${a3?a3.toLowerCase()+' was an issue too':'it really showed in the overall experience'}.`;
  } else if(a1){
    mid=rating>=4?`${a1} was a real highlight.`:`${a1} was where things fell a bit short.`;
  }
  return mid?`${opener} ${mid} ${ender}`:`${opener} ${ender}`;
}

let S={biz:null,rating:0,ans:{},review:'',mode:'ai',generating:false,plat:'google'};

  tripadvisor:{n:'TripAdvisor',icon:'🦉',url:b=>b.platforms?.tripadvisor?`https://www.tripadvisor.in/UserReview-${b.platforms.tripadvisor}`:null},

const TPL={restaurant:['google','zomato','swiggy','tripadvisor'],hotel:['google','oyo','mmt','tripadvisor','booking'],cafe:['google','zomato','swiggy'],bar:['google','zomato','tripadvisor'],salon:['google','tripadvisor'],hospital:['google'],gym:['google'],spa:['google','tripadvisor'],retail:['google','tripadvisor'],clothing:['google','tripadvisor'],other:['google']};

const DEMOS={
  'spice-garden-001':{business:{id:'spice-garden-001',name:'Spice Garden',type:'restaurant',description:'Authentic North Indian cuisine crafted with heirloom spices.',imageUrl:'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=800&q=80',googlePlaceId:'ChIJN1t_tDeuEmsRUsoyG83frY4'}},
  'taj-palace-002':{business:{id:'taj-palace-002',name:'Taj Palace Hotel',type:'hotel',description:'Five-star luxury — royal suites, world-class amenities.',imageUrl:'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=800&q=80',googlePlaceId:'ChIJN1t_tDeuEmsRUsoyG83frY5',platforms:{oyo:'73070'}}},
  'urban-glow-003':{business:{id:'urban-glow-003',name:'Urban Glow Salon',type:'salon',description:'Premium hair styling and skin treatments.',imageUrl:'https://images.unsplash.com/photo-1560066984-138daaa5c91a?w=800&q=80',googlePlaceId:'ChIJN1t_tDeuEmsRUsoyG83frY6'}},

  'apollo-005':{business:{id:'apollo-005',name:'Apollo Medicity',type:'hospital',description:'Multi-speciality hospital — compassionate care.',imageUrl:'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=800&q=80',googlePlaceId:'ChIJN1t_tDeuEmsRUsoyG83frY8'}},
  'brew-house-006':{business:{id:'brew-house-006',name:'The Brew House Cafe',type:'cafe',description:'Specialty coffees, artisan pastries and cozy vibes.',imageUrl:'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800&q=80',googlePlaceId:'ChIJN1t_tDeuEmsRUsoyG83frY9'}}
};

function pgbar(p){document.getElementById('pgbar').style.width=p+'%'}
let _tt;
function toast(msg,type,icon){
  const el=document.getElementById('toast');
  el.className='toast show '+(type||'y');
  document.getElementById('ti').textContent=icon||'✓';
  document.getElementById('tm').textContent=msg;
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),3200);
}
function bizId(){const p=location.pathname.split('/');return p[p.indexOf('review')+1]||null}
function wc(t){return t.trim()?t.trim().split(/\s+/).length:0}
function getAns(){return Object.values(S.ans).flatMap(v=>Array.isArray(v)?v:(v?[v]:[]))}
function getLanguage(){
  if(!S.biz?.languageConfig?.languages?.length) return '';
  if(S.biz.languageConfig.mode==='customer'){
    return document.getElementById('langSelect')?.value || '';
  }
  const active=S.biz.languageConfig.languages.filter(x=>(x.weight??0)>0);
  return active.length ? active.map(x=>x.label||x.code).join(' + ') : (S.biz.localLanguages||[]).join(' + ');
}
function getText(){return(S.mode==='direct'?document.getElementById('dta'):document.getElementById('rta'))?.value||S.review||''}

async function fetchBiz(id){
  pgbar(30);
  try{const r=await fetch(`${API}/business/${id}`,{signal:AbortSignal.timeout(5000)});pgbar(70);if(!r.ok)throw new Error('Not found');const d=await r.json();if(d.business?.reviewConfig?.maxWords)MAX_W=Math.min(80,Math.max(10,Number(d.business.reviewConfig.maxWords)));return d;}
  catch{pgbar(70);if(DEMOS[id])return DEMOS[id];throw new Error('Business not found');}
}

async function generate(){
  if(!S.rating||S.generating)return;
  S.generating=true;
  showCard('rcCard');setRB(loadH());
  setTimeout(()=>document.getElementById('rcCard')?.scrollIntoView({behavior:'smooth',block:'nearest'}),220);
  const ans=getAns();
  try{
    const r=await fetch(`${API}/generate-review`,{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(15000),body:JSON.stringify({rating:S.rating,businessType:S.biz.type,businessName:S.biz.name,businessId:S.biz.id,selectedChips:ans,language:getLanguage(),languageConfig:S.biz.languageConfig,reviewConfig:S.biz.reviewConfig,maxWords:MAX_W,humanStyle:true})});
    const d=await r.json();if(!r.ok){const err=new Error(d.error||'Failed');err.status=r.status;throw err;}S.review=d.review;
  }catch(e){
    const net=e.name==='TypeError'||e.name==='AbortError';
    if(net){S.review=humanReview(S.rating,S.biz.type,S.biz.name,ans);toast('Review ready!','y','✨');}
    else{S.review='';toast(e.status===403?(e.message||'Subscription inactive'):'Try again','y','⚠️');}
  }finally{
    S.generating=false;setRB(revH());
    if(S.review){showCard('acCard');setTimeout(()=>document.getElementById('acCard')?.scrollIntoView({behavior:'smooth',block:'nearest'}),200);}
  }
}

function typewrite(el,text){el.value='';let i=0;const t=setInterval(()=>{el.value+=text[i++];updWC(el);if(i>=text.length)clearInterval(t);},22);}
function updWC(el){
  const w=wc(el.value);const pct=Math.min(w/MAX_W*100,100);
  const f=document.getElementById('wfill');const wt=document.getElementById('wct');
  if(f)f.style.width=pct+'%';if(wt)wt.textContent=w+'/'+MAX_W+' words';S.review=el.value;
}

async function clip(txt){
  try{await navigator.clipboard.writeText(txt);}
  catch{const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);}
}
async function quickCopy(){const txt=getText();if(!txt.trim()){toast('Generate a review first','y','⚠️');return;}await clip(txt);toast('Copied!','g','📋');}
async function postOn(){
  const txt=getText();if(!txt.trim()){toast('Please generate a review first','y','⚠️');return;}
  await clip(txt);
  fetch(`${API}/save-analytics`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({businessId:S.biz.id,rating:S.rating,chips:getAns(),reviewLength:txt.length,wasPosted:true})}).catch(()=>{});
  showPH(txt);
  const p=PL[S.plat]||PL.google;const url=p.url(S.biz)||PL.google.url(S.biz);
  setTimeout(()=>window.open(url,'_blank'),1100);
}

function showPH(txt){
  document.getElementById('ph')?.remove();
  const p=PL[S.plat]||PL.google;
  const el=document.createElement('div');el.id='ph';
  const safe=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  el.innerHTML=`<div class="phi">📋</div>
    <div class="pht">Review <span>Copied!</span></div>
    <div class="phrv"><div class="phrl">Your Review</div><div class="phrt">${safe}</div></div>
    <div class="phin">
      <div class="phit">${p.icon} ${p.n} is opening…</div>
      <div class="phis">Click the review box and press<br>
        <span class="phk">Ctrl+V</span> or on mobile <span class="phk">Long press → Paste</span>
      </div>
    </div>
    <div class="ph-btns">
      <button class="ph-y" id="phCopyBtn">📋 Copy Again</button>
      <button class="ph-cl" onclick="document.getElementById('ph').remove()">Close</button>
    </div>`;
  document.body.appendChild(el);
  document.getElementById('phCopyBtn').onclick=()=>clip(txt).then(()=>toast('Copied!','g','📋'));
}

function selRating(n){
  S.rating=n;S.ans={};S.review='';updateStars(n);
  if(navigator.vibrate)navigator.vibrate(25);
  ['rcCard','acCard'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.classList.remove('in');}});
  showCard('qaCard');
  document.getElementById('qaInner').innerHTML=qaH();
  setTimeout(()=>document.getElementById('qaCard')?.scrollIntoView({behavior:'smooth',block:'nearest'}),320);
}
function updateStars(n){
  document.querySelectorAll('.sbtn').forEach((b,i)=>b.classList.toggle('lit',i<n));
  const m=document.getElementById('moodLbl');if(m)m.textContent=n?MOODS[n]:'Tap a star to rate ⬆';
}
function toggleChip(qid,val,el,type){
  const row=el.closest('.chips-row');
  if(type==='multi'){
    const arr=Array.isArray(S.ans[qid])?S.ans[qid]:[];
    el.classList.toggle('on');
    S.ans[qid]=el.classList.contains('on')?[...arr,val]:arr.filter(x=>x!==val);
    return;
  }
  row.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.toggle('on');S.ans[qid]=el.classList.contains('on')?val:'';
}
function setTextAnswer(qid,value){S.ans[qid]=value.trim();}
function selPlat(pid){
  S.plat=pid;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('sel',b.dataset.p===pid));
  renderActBtns();toast('Posting on '+(PL[pid]?.n||'Google')+'!','y',PL[pid]?.icon||'🌐');
}
function switchMode(m){
  S.mode=m;
  document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('active',t.dataset.m===m));
  document.getElementById('aiSec').style.display=m==='ai'?'block':'none';
  document.getElementById('dirSec').style.display=m==='direct'?'block':'none';
  if(m==='direct')showCard('acCard');renderActBtns();
}
function showCard(id){
  const el=document.getElementById(id);if(!el)return;
  el.style.display='block';void el.offsetWidth;setTimeout(()=>el.classList.add('in'),20);
  if(id==='acCard')setTimeout(()=>{renderPlatSel();renderActBtns();},30);
}
function setRB(h){const el=document.getElementById('rb');if(el)el.innerHTML=h;if(!S.generating&&S.review){const ta=document.getElementById('rta');if(ta)typewrite(ta,S.review);}}

function loadH(){return`<div class="dw"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="dlbl">Writing your review…</div></div>`;}

function revH(){
  const w=wc(S.review);const pct=Math.min(w/MAX_W*100,100);
  return`<div class="aihdr">
    <div class="aibadge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Zuit AI</div>
    <span class="ainote">Feel free to edit</span></div>
  <textarea class="rta" id="rta" maxlength="600" oninput="updWC(this)" placeholder="Your review will appear here…">${S.review}</textarea>
  <div class="rfooter">
    <span class="wct-txt" id="wct">${w}/${MAX_W} words</span>
    <button class="regen" onclick="generate()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Regenerate
    </button>
  </div>
  <div class="wbar-track"><div class="wbar-fill" id="wfill" style="width:${pct}%"></div></div>`;
}

function qaH(){
  const fallback=QS[S.biz.type]||QS.other;
  const qs=(S.biz.questions?.length?S.biz.questions:fallback).filter(q=>q.enabled!==false).sort((a,b)=>(a.order||0)-(b.order||0));
  const lang=S.biz.languageConfig?.mode==='customer'&&S.biz.languageConfig?.languages?.length
    ? `<div class="qblock"><div class="qtop"><div class="qnum">🌐</div><div class="qtxt">Which language should your review use?</div></div><select id="langSelect" class="lang-select">${S.biz.languageConfig.languages.map(x=>`<option value="${x.label||x.code}">${x.label||x.code}</option>`).join('')}</select></div>` : '';
  const html=qs.map((q,qi)=>{
    const opts=q.options||q.chips||[];
    const type=q.type||'single';
    let body='';
    if(type==='text') body=`<textarea class="qtext" placeholder="Type your answer…" oninput="setTextAnswer('${q.id}',this.value)"></textarea>`;
    else if(type==='yesno') body=`<div class="chips-row">${['Yes','No'].map((ch,ci)=>`<button class="chip" style="animation-delay:${ci*.03}s" onclick="toggleChip('${q.id}','${ch}',this,'single')">${ch}</button>`).join('')}</div>`;
    else if(type==='rating') body=`<div class="chips-row">${[1,2,3,4,5].map(n=>`<button class="chip" onclick="toggleChip('${q.id}','${n}/5',this,'single')">${n} ⭐</button>`).join('')}</div>`;
    else body=`<div class="chips-row">${opts.map((o,ci)=>{const label=typeof o==='string'?o:(o.label||o.value||'');return `<button class="chip" style="animation-delay:${(qi*opts.length+ci)*.03}s" onclick="toggleChip('${q.id}','${String(label).replace(/'/g,"\\'")}',this,'${type}')">${label}</button>`;}).join('')}</div>`;
    return `<div class="qblock"><div class="qtop"><div class="qnum">${qi+1}</div><div class="qtxt">${q.text||q.q||''}${q.required?'<span style="color:var(--g)"> *</span>':''}</div></div>${body}</div>`;
  }).join('');
  return lang+html;
}

function getAvailPlats(){
  const pids=TPL[S.biz.type]||['google'];
  return pids.filter(pid=>{const p=PL[pid];return p&&p.url(S.biz)!==null;});
}
function renderPlatSel(){
  const wrap=document.getElementById('platWrap');const pids=getAvailPlats();
  if(!wrap||pids.length<=1){if(wrap)wrap.innerHTML='';return;}
  wrap.innerHTML=`<div class="plbl">Where should we post your review?</div>
    <div class="pgrid">${pids.map(pid=>{const p=PL[pid];
      return`<button class="pbtn ${S.plat===pid?'sel':''}" data-p="${pid}" onclick="selPlat('${pid}')">
        <span class="pi">${p.icon}</span><span class="pn">${p.n}</span></button>`;
    }).join('')}</div>`;
}
function renderActBtns(){
  const wrap=document.getElementById('actWrap');const lbl=document.getElementById('actLbl');
  if(!wrap)return;const p=PL[S.plat]||PL.google;
  if(lbl)lbl.textContent='Post on '+p.n;
  wrap.innerHTML=`
    <button class="btn-post" onclick="postOn()"><span style="font-size:18px">${p.icon}</span>Post on ${p.n}</button>
    <button class="btn-cp" onclick="quickCopy()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Just Copy
    </button>`;
}

function renderQuestions(){
  const b=S.biz;
  const wrap=document.getElementById('qaInner');
  const card=document.getElementById('qaCard');
  if(!wrap||!card)return;
  const qs=(Array.isArray(b.questions)?b.questions:[]).filter(q=>q && q.enabled!==false).sort((a,b)=>(a.order??0)-(b.order??0));
  if(!qs.length){ card.style.display='block'; wrap.innerHTML='<div style="padding:12px 0;color:#777">No custom questions configured for this business.</div>'; return; }
  wrap.innerHTML=qs.map((q,i)=>{
    const id=String(q.id||('q'+i));
    const opts=Array.isArray(q.options)?q.options:[];
    const type=q.type||'single';
    if(type==='text') return '<div class="qrow"><div class="qtext">'+esc(q.text||'')+'</div><textarea class="dta" placeholder="Type your answer..." oninput="setTextAnswer(\''+id+'\',this.value)"></textarea></div>';
    if(type==='yesno') return '<div class="qrow"><div class="qtext">'+esc(q.text||'')+'</div><div class="chips">'+['Yes','No'].map(v=>'<button class="chip" onclick="toggleChip(\''+id+'\',\''+v+'\',this)">'+v+'</button>').join('')+'</div></div>';
    if(type==='rating') return '<div class="qrow"><div class="qtext">'+esc(q.text||'')+'</div><div class="chips">'+[1,2,3,4,5].map(v=>'<button class="chip" onclick="toggleChip(\''+id+'\',\''+v+'\',this)">'+v+'★</button>').join('')+'</div></div>';
    return '<div class="qrow"><div class="qtext">'+esc(q.text||'')+'</div><div class="chips">'+opts.map(v=>'<button class="chip" onclick="toggleChip(\''+id+'\',\''+String(v).replace(/'/g,"&#39;")+'\',this,'+(type==='multi'?'true':'false')+')">'+esc(v)+'</button>').join('')+'</div></div>';
  }).join('');
}
function render(){
  const b=S.biz;document.title='Review — '+b.name+' | Zuit';
  pgbar(100);setTimeout(()=>pgbar(0),600);
  document.getElementById('skel').style.display='none';
  const ct=document.getElementById('ct');ct.style.display='block';
  // Questions come from the live API response and are rendered after the business shell is mounted.
  ct.innerHTML=`
    <div class="hero">
      <img src="${b.imageUrl}" alt="${b.name}" onload="this.classList.add('ok')"/>
      <div class="hov"></div>
      <div class="hbody">
        <div class="htag">${ICONS[b.type]||'⭐'} ${b.type}</div>
        <h1 class="hname">${b.name}</h1>
        <p class="hdesc">${b.description}</p>
      </div>
    </div>
    <div class="cards">
      <div class="card" id="rCard">
        <div class="clbl">Rate Your Experience</div>
        <div class="stars-row" onmouseleave="updateStars(S.rating)">
          ${[1,2,3,4,5].map(n=>`
            <button class="sbtn" onmouseover="updateStars(${n})" onclick="selRating(${n})" aria-label="${n} stars">
              <svg class="ssvg" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>`).join('')}
        </div>
        <div class="mood-lbl" id="moodLbl">Tap a star to rate ⬆</div>
      </div>
      <div class="card" id="qaCard" style="display:none">
        <div class="clbl">Tell Us A Bit More</div>
        <div id="qaInner"></div>
        <button class="btn-gen" onclick="generate()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Generate My Review
        </button>
      </div>
      <div class="card" id="rcCard" style="display:none">
        <div class="clbl">Your Review</div>
        <div class="mtabs">
          <button class="mtab active" data-m="ai" onclick="switchMode('ai')">🤖 AI Written</button>
          <button class="mtab" data-m="direct" onclick="switchMode('direct')">✏️ Write Myself</button>
        </div>
        <div id="aiSec"><div id="rb"></div></div>
        <div id="dirSec" style="display:none">
          <textarea class="dta" id="dta" maxlength="600" placeholder="Write your own review in your own words…" oninput="S.review=this.value"></textarea>
          <div style="font-size:11px;color:var(--g);text-align:right;margin-top:6px">Keep it natural and specific ✓</div>
        </div>
      </div>
      <div class="card" id="acCard" style="display:none">
        <div class="clbl" id="actLbl">Share Your Review</div>
        <div id="platWrap"></div>
        <div style="display:flex;flex-direction:column;gap:10px" id="actWrap"></div>
      </div>
    </div>
    <div class="pwrd">Powered by <span>Zuit</span> · AI Review Platform</div>`;

  renderQuestions();

  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target);}});},{threshold:.08});
  document.querySelectorAll('.card').forEach(c=>{if(c.style.display!=='none')obs.observe(c);});
}

function renderErr(msg){
  pgbar(0);document.getElementById('skel').style.display='none';
  const ct=document.getElementById('ct');ct.style.display='block';
  ct.innerHTML=`<div class="err"><div class="erri">🔍</div><div class="errt">Not Found</div><div class="errs">${msg}</div></div>`;
}

(async()=>{
  const id=bizId();
  if(!id){renderErr('No business ID found in URL.');return;}
  try{pgbar(15);const d=await fetchBiz(id);S.biz=Object.assign({},d.business,{questions:Array.isArray(d.questions)?d.questions:[]});render();}
  catch(e){renderErr(e.message||'Could not load.');}
})();
</script>
